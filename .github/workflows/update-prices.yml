name: Update prices

on:
  schedule:
    # Every 30 minutes during NGX trading hours (Lagos 10:00–15:00 = 09:00–14:00 UTC), Monday–Friday
    - cron: '0,30 9-14 * * 1-5'
    # After the close and once at night, every day
    - cron: '20 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NGX and CBN prices
        run: python3 scripts/fetch_prices.py
      - name: Save prices.json
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add prices.json
            git commit -m "Update prices $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "No change"
          fi
